name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - 'dotnet_ai_azure_book/**'
      - 'book/**'
      - 'MiniPdf.wiki/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'documents/**'
      - 'dotnet_ai_azure_book/**'
      - 'book/**'
      - 'MiniPdf.wiki/**'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: read

jobs:
  review-workflow-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test reviewer automation and approval policy
        run: node --test .github/tests/auto-reviewers.test.cjs .github/tests/review-approval-policy.test.cjs

  build:
    runs-on: ubuntu-latest   

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install CJK TrueType font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-wqy-microhei

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Pack (verify NuGet package)
        run: dotnet pack src/MiniPdf/MiniPdf.csproj --no-build --configuration Release --output ./nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

  docx-font-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify required DOCX fonts
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:WINDIR 'Fonts'
          foreach ($font in @('cambria.ttc', 'cambriab.ttf', 'cambriaz.ttf', 'seguisym.ttf', 'seguiemj.ttf')) {
            if (-not (Test-Path -LiteralPath (Join-Path $fontDirectory $font))) {
              throw "Required DOCX test font is unavailable: $font"
            }
          }

      - name: Test DOCX rendering with system fonts
        run: dotnet test tests/MiniPdf.Tests/MiniPdf.Tests.csproj --configuration Release --filter "FullyQualifiedName~Docx|FullyQualifiedName~SystemFontTheoryAttributeTests" --verbosity normal --logger "trx;LogFileName=docx-font-results.trx"

      - name: Upload DOCX test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-font-test-results
          path: '**/docx-font-results.trx'
