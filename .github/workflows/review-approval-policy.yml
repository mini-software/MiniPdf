name: Review approval policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited, closed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: read
  checks: write

concurrency:
  group: review-approval-policy
  cancel-in-progress: false

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh approval requirements
        uses: actions/github-script@v7
        with:
          script: |
            const checkName = 'Review approval policy';
            const externalId = 'minipdf-review-approval-policy';
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });
            const groups = new Map();
            for (const pull of pulls.filter(pull => !pull.draft)) {
              const group = groups.get(pull.head.sha) ?? [];
              group.push(pull);
              groups.set(pull.head.sha, group);
            }
            if (groups.size === 0) {
              core.info('No open, ready-for-review PRs target main.');
              return;
            }
            const permissions = new Map();
            const failed = [];
            for (const [sha, group] of groups) {
              let check;
              try {
                const existing = await github.paginate(github.rest.checks.listForRef, {
                  ...context.repo,
                  ref: sha,
                  check_name: checkName,
                  filter: 'all',
                  per_page: 100
                });
                check = existing.find(run =>
                  run.app?.slug === 'github-actions' && run.external_id === externalId
                );
                const start = {
                  ...context.repo,
                  status: 'in_progress',
                  details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  output: {
                    title: 'Checking advisory approval requirements',
                    summary: 'Checking label-based advisory approvals. Native rules require one approval, or three core-reviewer approvals for important paths.'
                  }
                };
                if (check) {
                  await github.rest.checks.update({ ...start, check_run_id: check.id });
                } else {
                  ({ data: check } = await github.rest.checks.create({
                    ...start, name: checkName, head_sha: sha, external_id: externalId
                  }));
                }

                const results = [];
                for (const pull of group) {
                  const required = pull.labels.some(label => label.name.toLowerCase() === 'major-change') ? 3 : 1;
                  const reviews = await github.paginate(github.rest.pulls.listReviews, {
                    ...context.repo,
                    pull_number: pull.number,
                    per_page: 100
                  });
                  const latest = new Map();
                  for (const review of reviews.sort((left, right) => left.id - right.id)) {
                    if (review.user && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                      latest.set(review.user.login.toLowerCase(), review);
                    }
                  }
                  let approvals = 0;
                  for (const [login, review] of latest) {
                    if (review.state !== 'APPROVED' || review.user.type === 'Bot' ||
                        login === pull.user.login.toLowerCase()) {
                      continue;
                    }
                    if (!permissions.has(login)) {
                      const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                        ...context.repo,
                        username: review.user.login
                      });
                      permissions.set(login, ['write', 'maintain', 'admin'].includes(data.permission));
                    }
                    if (permissions.get(login)) {
                      approvals++;
                    }
                  }
                  results.push({ number: pull.number, required, approvals });
                }

                // Check runs are shared by PRs with the same head SHA.
                const waiting = results.filter(result => result.approvals < result.required);
                const summary = results
                  .map(result => `#${result.number}: ${result.approvals}/${result.required} eligible approvals`)
                  .join('\n');
                await github.rest.checks.update({
                  ...context.repo,
                  check_run_id: check.id,
                  status: 'completed',
                  conclusion: waiting.length > 0 ? 'action_required' : 'success',
                  output: {
                    title: waiting.length > 0 ? 'Advisory approval requirements not met' : 'Advisory approval requirements met',
                    summary: `${summary}\n\nAdvisory only: native file-based rules independently require one approval, or three core-reviewer approvals for important paths.`.slice(0, 65535)
                  }
                });
                core.info(summary);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.error(`Approval refresh failed for ${sha}: ${message}`);
                failed.push(sha);
                if (check) {
                  try {
                    await github.rest.checks.update({
                      ...context.repo,
                      check_run_id: check.id,
                      status: 'completed',
                      conclusion: 'failure',
                      output: {
                        title: 'Advisory approval refresh failed',
                        summary: `Unable to evaluate current approvals: ${message}\nNative file-based approval requirements remain enforced independently.`.slice(0, 65535)
                      }
                    });
                  } catch (reportError) {
                    core.error(`Failed to publish failure for ${sha}: ${String(reportError)}`);
                  }
                }
              }
            }
            if (failed.length > 0) {
              core.setFailed(`Approval refresh failed for ${failed.length} SHA group(s): ${failed.join(', ')}`);
            }
