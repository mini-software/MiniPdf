name: Go CI

on:
  push:
    branches: [main, master]
    paths:
      - 'minipdf-go/**'
      - '.github/workflows/go-ci.yml'
      - '.github/workflows/go-release.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'minipdf-go/**'
      - '.github/workflows/go-ci.yml'
      - '.github/workflows/go-release.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minipdf-go

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  windows-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: minipdf-go

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false

      - name: Test
        run: go test ./...