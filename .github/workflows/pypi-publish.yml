name: PyPI Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Python package version to publish (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minipdf/
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: minipdf-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install build twine

      - name: Validate release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          fi
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ -z "$TAG_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release version '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: minipdf-python/dist/