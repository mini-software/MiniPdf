name: PyPI Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Python package version to publish (for example, 0.7.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'python-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-13
          - os: macos-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: minipdf-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: python -m pip install maturin

      - name: Build wheels
        run: python -m maturin build --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: minipdf-python/dist/

  sdist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minipdf-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install maturin

      - name: Build sdist
        run: python -m maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: minipdf-python/dist/

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'python-v')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/minipdf/
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: minipdf-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: minipdf-python/dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: minipdf-python/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install twine

      - name: Validate release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          fi
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ -z "$TAG_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release version '$TAG_VERSION' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: minipdf-python/dist/