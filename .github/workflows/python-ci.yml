name: Python CI

on:
  push:
    branches: [main, master]
    paths:
      - 'minipdf-python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'minipdf-python/**'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: minipdf-python/pyproject.toml

      - name: Install
        run: python -m pip install -e "./minipdf-python[dev]"

      - name: Test
        run: python -m pytest minipdf-python/tests -q

      - name: Lint
        run: python -m ruff check minipdf-python

      - name: Format
        run: python -m ruff format --check minipdf-python

      - name: Type check
        run: python -m mypy minipdf-python/src minipdf-python/tests

      - name: Build
        run: python -m build minipdf-python

      - name: Check distributions
        run: python -m twine check minipdf-python/dist/*
